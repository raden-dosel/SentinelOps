<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SentinelOps — Security Installation Operations</title>
    <meta name="description" content="Offline-first Business Operations Management System for security installation services with CRM, quotation builder, invoicing, and project tracking." />
    <meta property="og:title" content="SentinelOps — Security Installation Operations" />
    <meta property="og:description" content="Offline-first Business Operations Management System for security installation services with CRM, quotation builder, invoicing, and project tracking." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SentinelOps" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="%BASE_URL%icons/icon-192.png" />
    <script>
      // Suppress Vite HMR / WebSocket client errors in Cloud Run / iframe proxy environment
      (function () {
        var origConsoleError = console.error;
        console.error = function () {
          var str = '';
          for (var i = 0; i < arguments.length; i++) {
            var a = arguments[i];
            if (typeof a === 'string') {
              str += a + ' ';
            } else if (a && typeof a === 'object') {
              str += (a.message || '') + ' ' + (a.stack || '') + ' ' + String(a) + ' ';
            }
          }
          if (
            str.includes('[vite] failed to connect to websocket') ||
            str.includes('WebSocket (failing)') ||
            str.includes('Check out your Vite / network configuration') ||
            str.includes("reading 'send'") ||
            str.includes('pwa-entry-point-loaded') ||
            str.includes('registerDevSW') ||
            str.includes('vite-pwa-plugin:dev-ready')
          ) {
            // Environment constraint: "HMR: Disabled. Ignore WebSocket errors."
            return;
          }
          return origConsoleError.apply(console, arguments);
        };

        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (registrations) {
            for (var i = 0; i < registrations.length; i++) {
              if (registrations[i].active && registrations[i].active.scriptURL.includes('dev-sw')) {
                registrations[i].unregister();
              }
            }
          }).catch(function () {});
        }
      })();
      window.addEventListener('error', function (e) {
        if (
          e.message &&
          (e.message.includes("reading 'send'") ||
            e.message.includes('WebSocket') ||
            e.message.includes('[vite]'))
        ) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        var msg = e.reason ? (e.reason.message || String(e.reason)) : '';
        if (
          msg.includes("reading 'send'") ||
          msg.includes('WebSocket') ||
          msg.includes('[vite]')
        ) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
