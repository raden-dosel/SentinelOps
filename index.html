    <link rel="apple-touch-icon" sizes="192x192" href="%BASE_URL%icons/icon-192.png" />
    <script>
      // Suppress Vite HMR / WebSocket client errors in Cloud Run / iframe proxy environment
      (function () {
        function shouldSuppress(msg) {
          if (!msg) return false;
          var s = String(msg);
          return (
            s.includes('[vite]') ||
            s.includes('WebSocket') ||
            s.includes("reading 'send'") ||
            s.includes('pwa-entry-point') ||
            s.includes('registerDevSW') ||
            s.includes('vite-pwa-plugin') ||
            s.includes('dev-ready')
          );
        }

        var origConsoleError = console.error;
        console.error = function () {
          var str = '';
          for (var i = 0; i < arguments.length; i++) {
            var a = arguments[i];
            if (typeof a === 'string') {
              str += a + ' ';
            } else if (a && typeof a === 'object') {
              str += (a.message || '') + ' ' + (a.stack || '') + ' ' + String(a) + ' ';
            }
          }
          if (shouldSuppress(str)) {
            return;
          }
          return origConsoleError.apply(console, arguments);
        };

        var origConsoleWarn = console.warn;
        console.warn = function () {
          var str = '';
          for (var i = 0; i < arguments.length; i++) {
            var a = arguments[i];
            if (typeof a === 'string') {
              str += a + ' ';
            } else if (a && typeof a === 'object') {
              str += (a.message || '') + ' ' + (a.stack || '') + ' ' + String(a) + ' ';
            }
          }
          if (shouldSuppress(str)) {
            return;
          }
          return origConsoleWarn.apply(console, arguments);
        };

        window.onerror = function (msg, source, lineno, colno, error) {
          var errStr = String(msg) + ' ' + (source || '') + ' ' + (error ? (error.message || error.stack || '') : '');
          if (shouldSuppress(errStr)) {
            return true;
          }
          return false;
        };

        window.addEventListener('error', function (e) {
          var errStr = (e.message || '') + ' ' + (e.error ? (e.error.message || e.error.stack || '') : '');
          if (shouldSuppress(errStr)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function (e) {
          var reason = e.reason;
          var msg = reason ? (reason.message || reason.stack || String(reason)) : '';
          if (shouldSuppress(msg)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);

        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (registrations) {
            for (var i = 0; i < registrations.length; i++) {
              registrations[i].unregister();
            }
          }).catch(function () {});
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
